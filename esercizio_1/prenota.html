<!DOCTYPE html >
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Prenotazione </title>
        <link rel="stylesheet" href="css\style.css">
    </head>
    <body>
        <header>
            <h1>Prenota il tuo posto ora</h1>
        </header>
        <nav>
            <ul>
                <a href="index.html">Menu Principale</a>
                <a href="programmazione.html">Programmazione della settimana</a>
                <a href="contatti.html">Orari e Contatti </a>
            </ul>
        </nav>
        <main>
            <section>

            <form action="#" method="post">
           
            <label for="nome">Nome e Cognome: </label>
            <input type="text" id="nome" name="nome" required>
   

  
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required>
    

 
            <label for="data-spettacolo">Data della visione: </label>
            <input type="date" id="data-visione" name="data_visione" required>
  
      
            <label for="film">Scegli il Film :</label>
            <input type="select" id="scelta-film" name="scelta-film" required>
            
        
            <label>Tipo di Biglietto:</label>
            <input type="radio" id="intero" name="tipo_biglietto" value="intero" checked>
            <label for="intero">Intero</label>
            
            <input type="radio" id="ridotto" name="tipo_biglietto" value="ridotto">
            <label for="ridotto">Ridotto</label>
       
     
            <label for="posti">Numero di Posti (max 10) :</label>
            <input type="number" id="posti" name="posti" min="1" max="10" value="1" required>
       

            <button type="submit">Conferma Prenotazione</button>

            </form>
        </section>
        </main>
    
        <footer>
            <h3>Tutti i film che vedete sono esclusive di questo cinema non le troverete da nessun'altra parte</h3>
        </footer>
    </body>
</html>
